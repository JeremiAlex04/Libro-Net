spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_ALLOWED_ORIGIN:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_BASE_URL:http://${EUREKA_HOSTPORT:eureka:8761}/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${SERVICE_HOST:gateway}
