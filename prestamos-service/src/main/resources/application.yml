#Configuracion y Conexión a la base de datos para el microservicio de préstamos
server:
  port: ${PORT:8081} # Este microservicio corre en su propio puerto

spring:
  application:
    name: libronet-prestamos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/biblioteca_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Crea las tablas automáticamente
    show-sql: true # Para ver en consola el SELECT FOR UPDATE

gateway:
  time-url: ${GATEWAY_TIME_URL:http://${GATEWAY_HOSTPORT:libronet-api-gateway}/api/time}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_BASE_URL:http://${EUREKA_HOSTPORT:localhost:8761}/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${SERVICE_HOST:localhost}
    instance-id: ${spring.application.name}:${SERVICE_HOST:localhost}:${server.port}
    metadata-map:
      sede: Sede Norte
      nodeId: 1

eleccion:
  node-id: 1
  node-name: Sede Norte

reloj:
  drift-ms: 0